<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comandas — Cochinita Pibil</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Firebase (CDN, compat SDK - vanilla JS, sin npm) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
    :root {
        --primary: #C9A227;
        --secondary: #8A6116;
        --accent: #5c3d10;
        --light: #FBF0D6;
        --dark: #241B10;
        --text: #333;
        --green: #52b788;
        --red: #c0392b;
        --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Poppins', 'Segoe UI', sans-serif;
        background: var(--light);
        color: var(--text);
        min-height: 100vh;
        padding-bottom: 60px;
    }
    header {
        background: var(--dark);
        color: var(--light);
        padding: 18px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 50;
        gap: 10px;
    }
    header h1 { font-size: 18px; font-weight: 800; color: var(--primary); }
    header .sub { font-size: 12px; opacity: .7; }
    header .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    #logoutBtn, .link-btn {
        background: transparent;
        border: 2px solid var(--primary);
        color: var(--primary);
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
    }

    /* ---------- LOGIN (idéntico a admin.html) ---------- */
    #loginScreen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .login-box {
        background: #fff;
        border-radius: 16px;
        padding: 36px 28px;
        max-width: 380px;
        width: 100%;
        box-shadow: 0 10px 40px rgba(0,0,0,.12);
        border-top: 6px solid var(--primary);
    }
    .login-box h2 { font-size: 22px; margin-bottom: 6px; color: var(--dark); }
    .login-box p { font-size: 13px; color: #888; margin-bottom: 24px; }
    .btn {
        display: inline-block;
        border: none;
        border-radius: 8px;
        padding: 13px 20px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        font-family: inherit;
        transition: transform .1s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: var(--dark); width: 100%; }
    .btn-danger {
        background: var(--red);
        color: #fff;
        width: 100%;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .btn-danger[hidden] { display: none; }
    .btn-google {
        background: #fff;
        color: #3c4043;
        border: 2px solid #e0e0e0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    .btn-google:hover { border-color: var(--primary); background: #fbf7ec; }
    #loginError {
        color: var(--red);
        font-size: 13px;
        margin-bottom: 14px;
        display: none;
        font-weight: 600;
    }

    /* ---------- APP ---------- */
    #appScreen { display: none; padding: 12px; max-width: 800px; margin: 0 auto; }

    .tabs {
        display: flex;
        background: #fff;
        border-radius: 12px;
        padding: 4px;
        margin: 14px 0;
        box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }
    .tabs button {
        flex: 1;
        border: none;
        background: transparent;
        padding: 12px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        color: var(--accent);
        border-radius: 9px;
        cursor: pointer;
    }
    .tabs button.active {
        background: var(--primary);
        color: var(--dark);
    }

    #emptyState {
        text-align: center;
        color: #a3906a;
        padding: 50px 20px;
        font-size: 14px;
        display: none;
    }
    #emptyState i { font-size: 32px; display: block; margin-bottom: 10px; }

    .order-card {
        background: #fff;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 14px;
        box-shadow: 0 2px 14px rgba(0,0,0,.06);
        border-left: 6px solid #ccc;
    }
    .order-card.status-nuevo { border-left-color: var(--blue); }
    .order-card.status-preparando { border-left-color: var(--primary); }
    .order-card.status-listo { border-left-color: var(--green); }
    .order-card.status-entregado { border-left-color: #aaa; opacity: 0.85; }

    .order-card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }
    .order-id { font-weight: 800; color: var(--dark); font-size: 14px; }
    .order-time { font-size: 12px; color: #999; }

    .order-service-tag {
        display: inline-block;
        background: #f8f4e9;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 20px;
        margin-bottom: 10px;
    }

    .order-items {
        list-style: none;
        font-size: 13px;
        color: var(--text);
        margin-bottom: 8px;
        line-height: 1.6;
    }
    .order-items li.addon { color: var(--secondary); font-size: 12px; }

    .order-total {
        font-weight: 800;
        color: var(--dark);
        font-size: 14px;
        margin-bottom: 6px;
    }

    .order-customer {
        font-size: 12px;
        color: #999;
        margin-bottom: 12px;
    }

    .order-status-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .5px;
        padding: 4px 10px;
        border-radius: 20px;
        margin-bottom: 12px;
        color: #fff;
    }
    .order-status-badge.status-nuevo { background: var(--blue); }
    .order-status-badge.status-preparando { background: var(--primary); color: var(--dark); }
    .order-status-badge.status-listo { background: var(--green); }
    .order-status-badge.status-entregado { background: #aaa; }

    .order-advance-btn {
        width: 100%;
    }

    #toast {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: var(--dark); color: #fff; padding: 12px 22px; border-radius: 30px;
        font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .3s;
        z-index: 200; box-shadow: 0 4px 20px rgba(0,0,0,.2);
    }
    #toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
    <div class="login-box">
        <h2>🎫 Comandas</h2>
        <p>Cochinita Pibil — inicia sesión con Google</p>
        <div id="loginError"></div>
        <button class="btn btn-google" id="googleLoginBtn" type="button">
            <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
            Continuar con Google
        </button>
    </div>
</div>

<!-- ============ APP (después de login) ============ -->
<div id="appScreen">
    <header>
        <div>
            <h1>🎫 Comandas</h1>
            <div class="sub" id="userEmailLabel"></div>
        </div>
        <div class="header-right">
            <a class="link-btn" href="./admin.html">Productos</a>
            <button id="logoutBtn">Salir</button>
        </div>
    </header>

    <div style="padding: 0 8px; max-width: 800px; margin: 0 auto;">
        <div class="tabs">
            <button id="tabActive" class="active">Activas</button>
            <button id="tabHistory">Historial</button>
        </div>

        <button type="button" class="btn btn-danger" id="clearHistoryBtn" hidden>
            <i class="fas fa-trash"></i> Vaciar historial
        </button>

        <div id="emptyState">
            <i class="fas fa-clipboard-list"></i>
            <span id="emptyStateText">No hay comandas activas por ahora.</span>
        </div>

        <div id="ordersList"><!-- generado por JS --></div>
    </div>
</div>

<div id="toast"></div>

<script>
    // ==================================================
    // CONFIGURACIÓN — Firebase (mismo proyecto que index.html y admin.html)
    // ==================================================
    const firebaseConfig = {
        apiKey: "AIzaSyA3D1_bBKQJS2XQa_H0iSyJQ-xl51cj_0Q",
        authDomain: "cochinita-pibil-admin.firebaseapp.com",
        projectId: "cochinita-pibil-admin",
        storageBucket: "cochinita-pibil-admin.firebasestorage.app",
        messagingSenderId: "329969528973",
        appId: "1:329969528973:web:d7c60b4243f1ce5c9432c4"
    };
    const ADMIN_EMAIL = "cochinitapibil172@gmail.com"; // única cuenta autorizada

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const comandasRef = db.collection('comandas');
    const clientesRef = db.collection('clientes');

    let LOYALTY_THRESHOLD = 7; // valor de respaldo mientras carga la configuración real
    db.collection('config').doc('general').onSnapshot(doc => {
        if (doc.exists && doc.data().loyaltyThreshold) {
            LOYALTY_THRESHOLD = doc.data().loyaltyThreshold;
        }
    }, err => console.error('Error leyendo configuración:', err));

    // ==================================================
    // LOGIN / LOGOUT (igual que admin.html)
    // ==================================================
    const loginScreen = document.getElementById('loginScreen');
    const appScreen = document.getElementById('appScreen');
    const loginError = document.getElementById('loginError');

    const googleProvider = new firebase.auth.GoogleAuthProvider();
    document.getElementById('googleLoginBtn').addEventListener('click', () => {
        loginError.style.display = 'none';
        auth.signInWithPopup(googleProvider)
            .catch(err => {
                if (err.code === 'auth/popup-closed-by-user') return;
                loginError.textContent = 'No se pudo iniciar sesión con Google. Intenta de nuevo.';
                loginError.style.display = 'block';
            });
    });

    document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

    auth.onAuthStateChanged(user => {
        if (user && user.email === ADMIN_EMAIL) {
            loginScreen.style.display = 'none';
            appScreen.style.display = 'block';
            document.getElementById('userEmailLabel').textContent = user.email;
            loadOrders();
        } else if (user) {
            auth.signOut();
            loginScreen.style.display = 'flex';
            appScreen.style.display = 'none';
            loginError.textContent = 'Esta cuenta no tiene permiso para ver las comandas.';
            loginError.style.display = 'block';
        } else {
            loginScreen.style.display = 'flex';
            appScreen.style.display = 'none';
        }
    });

    // ==================================================
    // TOAST helper
    // ==================================================
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
    }

    function formatMoney(n) {
        const num = typeof n === 'string' ? parseFloat(n.replace(/[^0-9.]/g, '')) : n;
        return 'MX$' + (num || 0).toFixed(2);
    }

    function formatTime(ts) {
        if (!ts || !ts.toDate) return '—';
        return ts.toDate().toLocaleString('es-MX', {
            day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
        });
    }

    function serviceLabel(order) {
        if (order.orderType === 'delivery') return '🛵 A domicilio';
        if (order.orderType === 'dine_in') return `🍽️ Mesa ${order.tableNumber ?? '—'}`;
        return '🏪 Recoger en el local';
    }

    // ==================================================
    // CARGA Y RENDER DE COMANDAS
    // ==================================================
    const STATUS_LABELS = {
        nuevo: 'Nuevo',
        preparando: 'En preparación',
        listo: 'Listo',
        entregado: 'Entregado'
    };
    const NEXT_STATUS = { nuevo: 'preparando', preparando: 'listo', listo: 'entregado' };
    const NEXT_LABEL = {
        nuevo: 'Empezar preparación',
        preparando: 'Marcar como listo',
        listo: 'Marcar como entregado'
    };

    let allOrders = [];
    let currentView = 'active'; // 'active' | 'history'

    function loadOrders() {
        comandasRef.orderBy('createdAt', 'desc').limit(200)
            .onSnapshot(snapshot => {
                allOrders = [];
                snapshot.forEach(doc => allOrders.push({ id: doc.id, ...doc.data() }));
                renderOrders();
            }, err => {
                console.error(err);
                showToast('Error leyendo comandas: ' + err.message);
            });
    }

    function renderOrders() {
        const list = currentView === 'active'
            ? allOrders.filter(o => o.status !== 'entregado')
                       .sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0))
            : allOrders.filter(o => o.status === 'entregado');

        const emptyState = document.getElementById('emptyState');
        document.getElementById('emptyStateText').textContent = currentView === 'active'
            ? 'No hay comandas activas por ahora.'
            : 'Todavía no hay pedidos en el historial.';
        emptyState.style.display = list.length === 0 ? 'block' : 'none';

        const container = document.getElementById('ordersList');
        container.innerHTML = list.map(o => {
            const itemsHtml = (o.items || []).map(i =>
                i.freeRedeemed
                    ? `<li style="color: var(--green); font-weight:700;">🎁 ${i.qty}x ${i.name} — GRATIS (cupón)</li>`
                    : `<li>${i.qty}x ${i.name} — ${formatMoney(i.price)}</li>`
            ).join('');
            const addonsHtml = (o.addons || []).map(a =>
                `<li class="addon">+ ${a.qty}x ${a.name}</li>`
            ).join('');
            const customer = o.customerEmail || 'Invitado';
            const nextStatus = NEXT_STATUS[o.status];
            const btnHtml = nextStatus
                ? `<button class="btn btn-primary order-advance-btn" data-id="${o.id}" data-next="${nextStatus}">${NEXT_LABEL[o.status]} →</button>`
                : '';

            return `
            <div class="order-card status-${o.status}">
                <div class="order-card-top">
                    <span class="order-id">#${o.id.slice(-6).toUpperCase()}</span>
                    <span class="order-time">${formatTime(o.createdAt)}</span>
                </div>
                <div class="order-service-tag">${serviceLabel(o)}</div>
                <ul class="order-items">${itemsHtml}${addonsHtml}</ul>
                <div class="order-total">Total: ${formatMoney(o.total)}</div>
                <div class="order-customer"><i class="fas fa-user"></i> ${customer}</div>
                <div class="order-status-badge status-${o.status}">${STATUS_LABELS[o.status] || o.status}</div>
                ${btnHtml}
            </div>`;
        }).join('');

        container.querySelectorAll('.order-advance-btn').forEach(btn => {
            btn.addEventListener('click', () => advanceStatus(btn.dataset.id, btn.dataset.next));
        });
    }

    function advanceStatus(id, nextStatus) {
        comandasRef.doc(id).update({ status: nextStatus })
            .then(() => {
                showToast('Actualizado a "' + STATUS_LABELS[nextStatus] + '"');
                if (nextStatus === 'entregado') {
                    const order = allOrders.find(o => o.id === id);
                    if (order && order.countsForLoyalty && order.uid) {
                        grantLoyaltyCredit(order.uid);
                    }
                }
            })
            .catch(err => showToast('Error: ' + err.message));
    }

    // Suma 1 pedido entregado a la cuponera del cliente. Cada vez que junta
    // LOYALTY_THRESHOLD pedidos, se le regala un platillo gratis — pero los
    // cupones no son acumulables: si ya tiene uno sin usar, no se le genera
    // otro aunque vuelva a juntar la cantidad de pedidos requerida.
    function grantLoyaltyCredit(uid) {
        const clienteRef = clientesRef.doc(uid);
        db.runTransaction(async (tx) => {
            const doc = await tx.get(clienteRef);
            const data = doc.exists ? doc.data() : { ordersCompleted: 0, freeDishesAvailable: 0 };
            const newCount = (data.ordersCompleted || 0) + 1;
            const currentFree = data.freeDishesAvailable || 0;
            const updates = {
                ordersCompleted: newCount,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            if (newCount % LOYALTY_THRESHOLD === 0 && currentFree < 1) {
                updates.freeDishesAvailable = currentFree + 1;
            }
            tx.set(clienteRef, updates, { merge: true });
        }).catch(err => console.error('Error actualizando cuponera:', err));
    }

    document.getElementById('tabActive').addEventListener('click', () => {
        currentView = 'active';
        document.getElementById('tabActive').classList.add('active');
        document.getElementById('tabHistory').classList.remove('active');
        document.getElementById('clearHistoryBtn').hidden = true;
        renderOrders();
    });

    document.getElementById('tabHistory').addEventListener('click', () => {
        currentView = 'history';
        document.getElementById('tabHistory').classList.add('active');
        document.getElementById('tabActive').classList.remove('active');
        document.getElementById('clearHistoryBtn').hidden = false;
        renderOrders();
    });

    // Borra en lote todas las comandas ya entregadas (solo historial; las
    // activas nunca se tocan). Firestore limita 500 operaciones por batch,
    // así que se parte en bloques de 450 por seguridad.
    document.getElementById('clearHistoryBtn').addEventListener('click', async () => {
        const delivered = allOrders.filter(o => o.status === 'entregado');
        if (delivered.length === 0) {
            showToast('El historial ya está vacío');
            return;
        }
        const sure = confirm(
            `¿Seguro que quieres borrar ${delivered.length} comanda(s) del historial?\n\n` +
            'Esto las elimina permanentemente de la base de datos y no se puede deshacer.'
        );
        if (!sure) return;

        const btn = document.getElementById('clearHistoryBtn');
        btn.disabled = true;
        try {
            const CHUNK = 450;
            for (let i = 0; i < delivered.length; i += CHUNK) {
                const batch = db.batch();
                delivered.slice(i, i + CHUNK).forEach(o => batch.delete(comandasRef.doc(o.id)));
                await batch.commit();
            }
            showToast('Historial vaciado');
        } catch (err) {
            console.error(err);
            showToast('Error borrando historial: ' + err.message);
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
